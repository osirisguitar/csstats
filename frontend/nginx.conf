server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        # Variable defers DNS resolution to request time, so nginx starts
        # even when the backend host is unreachable (e.g. in-cluster,
        # where the ingress routes /api directly to the backend service).
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
